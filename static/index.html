<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miles & Points Portfolio</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=3" id="favicon">
<script>
// Cache-bust favicon with timestamp on each load
(function(){ var f=document.getElementById('favicon'); var t=new Date().getTime(); f.setAttribute('href','/static/favicon.svg?v='+t); })();
</script>
<meta name="theme-color" content="#0d1f5c">
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<div id="app">
<div class="header">
  <div class="logo">
    <span class="logo-wing">✈</span>
    Miles & Points Portfolio
  </div>
  <nav class="tabs">
    <button class="tab-btn active" onclick="gotoTab('dashboard')">Dashboard</button>
    <button class="tab-btn" onclick="gotoTab('ffp')">FFP Miles</button>
    <button class="tab-btn" onclick="gotoTab('bank')">Bank Points</button>
    <button class="tab-btn" onclick="gotoTab('activity')">Activity</button>
    <button class="tab-btn" onclick="gotoTab('redemptions')">Redemptions</button>
    <button class="tab-btn" onclick="gotoTab('costbasis')">Cost Basis</button>
    <button class="tab-btn" onclick="gotoTab('settings')">Settings</button>
  </nav>
</div>

<div class="content">
  <div id="pane-dashboard" class="tab-pane active"></div>
  <div id="pane-ffp"       class="tab-pane"></div>
  <div id="pane-bank"      class="tab-pane"></div>
  <div id="pane-activity"     class="tab-pane"></div>
  <div id="pane-redemptions"  class="tab-pane"></div>
  <div id="pane-costbasis"    class="tab-pane"></div>
  <div id="pane-settings"     class="tab-pane"></div>
</div>

<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-hd" id="modal-hd"></div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="doSave()">Save changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/js/config.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/modal.js"></script>
<script src="/static/js/tabs.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/ffp.js"></script>
<script src="/static/js/bank.js"></script>
<script src="/static/js/activity.js"></script>
<script src="/static/js/redemptions.js"></script>
<script src="/static/js/costbasis.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
